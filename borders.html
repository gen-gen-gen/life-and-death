<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guess da country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1E6CB;
    --paper-deep:#E6D6AC;
    --ink:#2B2A28;
    --ink-soft:#74695A;
    --green:#3F6B4A;
    --red:#9C3B33;
    --accent:#28596B;
    --accent-soft:rgba(40,89,107,0.22);
    --sea:#7FA3AC;
    --line:#C9B98B;
    --backdrop:#0B1626;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--backdrop);
    background-image:
      radial-gradient(circle at 18% 16%, rgba(255,255,255,0.08), transparent 60%),
      radial-gradient(circle at 82% 84%, rgba(0,0,0,0.3), transparent 60%);
    font-family:'Lora', serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .sheet{
    width:100%;
    max-width:760px;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 0 0 1px var(--paper-deep), 0 12px 30px rgba(43,42,40,0.18);
    padding:32px 32px 36px;
    position:relative;
  }
  .sheet::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  header{ text-align:center; margin-bottom:4px; }
  .site-nav{
    text-align:center;
    font-size:11px;
    letter-spacing:0.5px;
    margin:-4px 0 10px;
  }
  .site-nav a{ color:var(--ink-soft); text-decoration:none; border-bottom:1px dashed var(--ink-soft); }
  .site-nav a:hover{ color:var(--ink); border-bottom-color:var(--ink); }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 12px;
    letter-spacing:0.5px;
  }
  .tagline{
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 18px;
    text-align:center;
  }
  .stat-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-family:'Lora', serif;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);
    padding:8px 2px;
    margin-bottom:12px;
    letter-spacing:0.5px;
    flex-wrap:wrap;
  }
  .stat-row b{ color:var(--ink); font-weight:400; }
  .pips-row{
    display:flex; justify-content:center; align-items:center; gap:10px;
    margin:0 0 14px;
  }
  .pip{
    width:9px; height:9px; border-radius:50%;
    background:var(--paper-deep);
    border:1px solid var(--ink-soft);
  }
  .pip.filled{ background:var(--accent); border-color:var(--accent); }
  .pip.current{ box-shadow:0 0 0 3px var(--accent-soft); }
  .pip.correct{ background:var(--green); border-color:var(--green); }
  .pip.wrong{ background:var(--red); border-color:var(--red); }
  .level-label{
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .level-label b{ color:var(--ink); font-weight:500; }
  .map-frame{
    border:1px solid var(--ink-soft);
    box-shadow:0 0 0 4px var(--paper), 0 0 0 5px var(--ink-soft);
    margin-bottom:10px;
    background:var(--paper-deep);
    overflow:hidden;
    position:relative;
  }
  svg.map{ display:block; width:100%; height:auto; cursor:grab; touch-action:none; }
  svg.map:active{ cursor:grabbing; }
  .map-frame.locked svg.map{ cursor:default; touch-action:pan-y; }
  .map-frame.locked svg.map:active{ cursor:default; }
  .map-hint{
    text-align:center;
    font-size:11px;
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .zoom-controls{
    display:flex; gap:8px; justify-content:center;
    margin:0 0 18px;
  }
  .zoom-controls button{ padding:4px 16px; }

  .guess-row{ display:flex; gap:10px; margin-bottom:8px; }
  .combo{ position:relative; flex:1; min-width:0; }
  .suggestions{
    display:none;
    position:absolute;
    top:100%; left:0; right:0;
    margin-top:2px;
    background:var(--paper);
    border:1px solid var(--ink-soft);
    max-height:220px;
    overflow-y:auto;
    z-index:20;
    box-shadow:0 8px 18px rgba(43,42,40,0.22);
  }
  .suggestions.show{ display:block; }
  .suggestions .opt{
    padding:8px 10px;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--paper-deep);
  }
  .suggestions .opt:last-child{ border-bottom:none; }
  .suggestions .opt:hover,
  .suggestions .opt.active{ background:var(--paper-deep); }
  input[type=text]{
    width:100%;
    font-family:'Lora', serif;
    font-size:16px;
    padding:10px 4px;
    border:none;
    border-bottom:1px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  input[type=text]:focus{ border-bottom-color:var(--ink); }
  input[type=text]:disabled{ opacity:0.5; }
  button{
    font-family:'Lora', serif;
    font-size:12px;
    letter-spacing:0.5px;
    padding:0 18px;
    cursor:pointer;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    white-space:nowrap;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  button:hover:not(:disabled){ background:var(--ink); color:var(--paper); }
  button:active:not(:disabled){ transform:scale(0.97); }
  button:disabled{ opacity:0.35; cursor:default; }
  .skip-link{
    display:block;
    width:100%;
    text-align:center;
    border:none;
    background:none;
    text-decoration:underline;
    font-family:'Lora', serif;
    font-size:12px;
    color:var(--ink-soft);
    padding:4px 0 0;
  }
  .skip-link:hover:not(:disabled){ background:none; color:var(--ink); }

  .feedback{
    margin-top:22px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    display:none;
    position:relative;
  }
  .feedback.show{ display:block; }
  .stamp{
    position:absolute;
    top:6px; right:6px;
    width:80px; height:80px;
    border-radius:50%;
    border:3px double currentColor;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:'Lora', serif;
    font-size:13px;
    text-transform:uppercase;
    transform:rotate(-10deg);
    line-height:1.2;
  }
  .stamp.correct{ color:var(--green); }
  .stamp.wrong{ color:var(--red); }
  .reveal-name{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 6px;
    padding-right:96px;
  }
  .reveal-note{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 10px;
    padding-right:96px;
    line-height:1.6;
  }
  #guess-line{ color:var(--red); font-style:italic; }
  #guess-line:empty{ display:none; }
  .feedback-actions{
    display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;
  }

  .summary{ display:none; }
  .summary.show{ display:block; }
  .summary-pips{
    display:flex; justify-content:center; gap:12px; margin:10px 0 18px;
  }
  .summary-pips span{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; border:1.5px solid;
  }
  .summary-pips span.correct{ color:var(--green); border-color:var(--green); }
  .summary-pips span.wrong{ color:var(--red); border-color:var(--red); }
  .summary-score{
    text-align:center;
    font-family:'Playfair Display', serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 4px;
  }
  .summary-sub{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .countdown{
    font-family:'Lora', serif;
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 16px;
    text-align:center;
  }
  .countdown b{ color:var(--ink); font-weight:400; }
  .summary-actions{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
  }
  .loading-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:40px 0;
  }
  .freeplay-banner{
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
    display:none;
  }
  .freeplay-banner.show{ display:block; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
  @media (max-width:480px){
    .sheet{ padding:22px 18px 28px; }
    h1{ font-size:26px; }
    .stamp{ width:60px; height:60px; font-size:10px; top:0; right:0; }
    .reveal-name, .reveal-note{ padding-right:0; }
  }
</style>

<body>
<div class="sheet">
  <header>
    <h1>guess da country</h1>
  </header>
  <p class="site-nav"><a href="index.html">← Vitals</a></p>

  <div class="stat-row">
    <span id="date-line">Loading…</span>
    <span>Streak <b id="streak">0</b></span>
    <span id="mode-line">Daily</span>
  </div>

  <div id="pips-wrap">
    <div class="pips-row" id="pips-row"></div>
    <p class="level-label" id="level-label">Puzzle <b>1</b> of 5 · <b>Wide</b></p>
  </div>

  <div id="map-section">
    <div class="map-frame" id="map-frame">
      <svg id="map" class="map" viewBox="0 0 680 420" role="img" aria-label="Zoomable world map with a single unlabeled point">
        <rect x="0" y="0" width="680" height="420" fill="var(--paper)"></rect>
        <g id="zoom-layer">
          <g id="world-west"></g>
          <path id="land" fill="var(--sea)" fill-rule="evenodd" stroke="var(--ink-soft)" stroke-width="0.5" vector-effect="non-scaling-stroke"></path>
          <path id="reveal-outline" fill="var(--green)" fill-opacity="0.45" fill-rule="evenodd" stroke="var(--green)" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="0"></path>
          <path id="reveal-outline-guess" fill="var(--red)" fill-opacity="0.45" fill-rule="evenodd" stroke="var(--red)" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="0"></path>
          <g id="world-east"></g>
          <g id="pin-mark">
            <circle class="pulse" r="10" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.55"></circle>
            <g class="marker-inner"></g>
          </g>
        </g>
        <text id="loading-text" x="340" y="210" text-anchor="middle" font-family="'Lora', serif" font-size="13" fill="var(--ink-soft)">Unrolling the map…</text>
      </svg>
    </div>
    <p class="map-hint" id="map-hint">Guess to unlock pan &amp; zoom</p>
    <div class="zoom-controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-reset" type="button" aria-label="Reset view to the puzzle's starting zoom">Reset view</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>

  <div id="puzzle-view">
    <div class="guess-row">
      <div class="combo">
        <input type="text" id="guess-input" placeholder="Type a country…" autocomplete="off" disabled>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <button id="submit-btn" type="button" disabled>Submit</button>
    </div>
    <button class="skip-link" id="skip-btn" type="button" disabled>I don't know — reveal</button>

    <div class="feedback" id="feedback">
      <div class="stamp" id="stamp"></div>
      <p class="reveal-name" id="reveal-name"></p>
      <p class="reveal-note" id="guess-line"></p>
      <p class="reveal-note" id="reveal-note"></p>
      <div class="feedback-actions">
        <button id="next-btn" type="button">Next puzzle →</button>
      </div>
    </div>
  </div>

  <div class="summary" id="summary-view">
    <p class="summary-score" id="summary-score"></p>
    <div class="summary-pips" id="summary-pips"></div>
    <p class="summary-sub" id="summary-sub"></p>
    <p class="countdown" id="countdown-line"></p>
    <div class="summary-actions">
      <button id="share-btn" type="button">Share result</button>
      <button id="practice-btn" type="button">Keep practicing →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const svgNS='http://www.w3.org/2000/svg';
const WIDTH=680, HEIGHT=420;
const R_KM=6371;
const STORAGE_KEY='terra-incognita:v1';
const EPOCH_UTC=Date.UTC(2026,0,1);

// Entries that are disputed zones, military bases, uninhabited reefs/glaciers,
// or dependent territories of another sovereign state — excluded from the answer pool.
const EXCLUDE_NAMES=new Set([
  "Antarctica","Vatican","Coral Sea Is.","Bajo Nuevo Bank","Scarborough Reef","Serranilla Bank",
  "Ashmore and Cartier Is.","Clipperton I.","Spratly Is.","Cyprus U.N. Buffer Zone","Baikonur",
  "USNB Guantanamo Bay","Akrotiri","Dhekelia","Siachen Glacier","Br. Indian Ocean Ter.","Indian Ocean Ter.",
  "Heard I. and McDonald Is.","S. Geo. and the Is.","Fr. S. Antarctic Lands","Fr. Polynesia","New Caledonia",
  "Wallis and Futuna Is.","Puerto Rico","Falkland Is.","Hong Kong","Macao","Faeroe Is.","Åland",
  "Isle of Man","Jersey","Guernsey","Gibraltar","Bermuda","Anguilla","Montserrat","Sint Maarten","Curaçao",
  "Aruba","St-Martin","St-Barthélemy","British Virgin Is.","U.S. Virgin Is.","Cayman Is.","Turks and Caicos Is.",
  "St. Pierre and Miquelon","American Samoa","Guam","N. Mariana Is.","U.S. Minor Outlying Is.","Cook Is.",
  "Niue","Norfolk Island","Pitcairn Is.","N. Cyprus","W. Sahara","Somaliland"
]);
const MIN_AREA_KM2=1000; // also drops micro-states too small for a meaningful zoom ramp (Monaco, Singapore, Malta, ...)

// Difficulty no longer comes from raw zoom — the view always widens dynamically until real
// coastline is visible (see computeSafeScale), so a puzzle is never a blank, unreasonable patch.
// preferBorder: chance of sampling near a real shared land border (vs. a coastline) — the actual
//               difficulty lever, since a border between look-alike neighbors is genuinely ambiguous.
// tRange: mild inward jitter (fraction of border/coast→centroid line) so the pin isn't always
//         sitting exactly on the sampled edge.
// zoomFactor: fraction of the "safe" (coastline-guaranteed) zoom to actually use — 1.0 means
//             zoom in exactly as tight as still safely shows the coastline; <1 backs off for more context.
const LEVELS=[
  {label:'Wide',        preferBorder:0.10, tRange:[0.10,0.22], zoomFactor:0.32},
  {label:'Regional',    preferBorder:0.30, tRange:[0.07,0.16], zoomFactor:0.52},
  {label:'Close',       preferBorder:0.50, tRange:[0.05,0.12], zoomFactor:0.72},
  {label:'Tight',       preferBorder:0.70, tRange:[0.03,0.08], zoomFactor:0.90},
  {label:'Point-blank', preferBorder:0.88, tRange:[0.01,0.04], zoomFactor:1.00}
];

function mulberry32(seed){
  let t=seed>>>0;
  return function(){
    t+=0x6D2B79F5;
    let r=Math.imul(t ^ t>>>15, 1|t);
    r=(r+Math.imul(r ^ r>>>7, 61|r)) ^ r;
    return ((r ^ r>>>14)>>>0)/4294967296;
  };
}
function hashSeed(a,b){
  let h=Math.imul(a ^ 0x9E3779B9, 2654435761) ^ Math.imul(b + 1, 40503);
  h=(h ^ (h>>>16))>>>0;
  return h;
}
function normalize(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
}

// ---------- Daily / persistent state ----------
function todayUTC(){
  const n=new Date();
  return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate());
}
function puzzleNumber(){
  return Math.floor((todayUTC()-EPOCH_UTC)/86400000)+1;
}
function msUntilNextUTCMidnight(){
  const n=new Date();
  const next=Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()+1, 0,0,0);
  return next-n.getTime();
}
function formatCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function formatDate(){
  const n=new Date();
  return n.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'})+' (UTC)';
}
function loadState(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); return raw?JSON.parse(raw):{}; }catch(e){ return {}; }
}
function saveState(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }

// ---------- Geometry engine ----------
let projection, pathGen, zoomBehavior, coastIndex;
let countryPool=[], countryByName=new Map();
function geoXY(lat,lon){ return projection([lon,lat]); }

function decodeArc(arc, transform){
  let x=0,y=0; const pts=[];
  for(const d of arc){
    x+=d[0]; y+=d[1];
    pts.push([x*transform.scale[0]+transform.translate[0], y*transform.scale[1]+transform.translate[1]]);
  }
  return pts;
}

// Decode every arc once and tally how many country rings each arc participates in.
// usage===1 means the arc borders open ocean only (coastline); usage>=2 means it's a shared
// political border between two countries. Both buildCountryPool and buildCoastIndex reuse this.
function computeArcInfo(world){
  const transform=world.transform;
  const decodedArcs=world.arcs.map(a=>decodeArc(a, transform));
  const arcUsage=new Map();
  function tally(ring){ for(const idx of ring){ const k=idx>=0?idx:~idx; arcUsage.set(k,(arcUsage.get(k)||0)+1); } }
  world.objects.countries.geometries.forEach(g=>{
    if(g.type==='Polygon') (g.arcs||[]).forEach(tally);
    else if(g.type==='MultiPolygon') (g.arcs||[]).forEach(poly=>poly.forEach(tally));
  });
  return {decodedArcs, arcUsage};
}

// Flat, grid-bucketed index of every coastline point on Earth (arcs touching open ocean only),
// used to find how far a candidate puzzle point sits from any visible coastline — see nearestCoastKm.
function buildCoastIndex(arcInfo){
  const cellSize=2; // degrees
  const grid=new Map();
  function addPoint(lon,lat){
    const key=Math.floor(lon/cellSize)+','+Math.floor(lat/cellSize);
    let arr=grid.get(key);
    if(!arr){ arr=[]; grid.set(key,arr); }
    arr.push(lon,lat);
  }
  arcInfo.decodedArcs.forEach((pts,idx)=>{
    if((arcInfo.arcUsage.get(idx)||0)!==1) return;
    pts.forEach(p=>{
      addPoint(p[0],p[1]);
      if(p[0]>150) addPoint(p[0]-360,p[1]);
      else if(p[0]<-150) addPoint(p[0]+360,p[1]);
    });
  });
  return {grid, cellSize};
}

function nearestCoastKm(lat, lon, coastIndex){
  const {grid, cellSize}=coastIndex;
  const cx=Math.floor(lon/cellSize), cy=Math.floor(lat/cellSize);
  let best=Infinity, foundAtRing=-1;
  for(let ring=0; ring<=90; ring++){
    const cells=[];
    if(ring===0) cells.push([cx,cy]);
    else{
      for(let dx=-ring; dx<=ring; dx++){ cells.push([cx+dx,cy-ring]); cells.push([cx+dx,cy+ring]); }
      for(let dy=-ring+1; dy<=ring-1; dy++){ cells.push([cx-ring,cy+dy]); cells.push([cx+ring,cy+dy]); }
    }
    let ringHasPoints=false;
    for(const [gx,gy] of cells){
      const arr=grid.get(gx+','+gy);
      if(!arr) continue;
      ringHasPoints=true;
      for(let i=0;i<arr.length;i+=2){
        const d=d3.geoDistance([lon,lat],[arr[i],arr[i+1]])*R_KM;
        if(d<best) best=d;
      }
    }
    if(ringHasPoints && foundAtRing<0) foundAtRing=ring;
    if(foundAtRing>=0 && ring>=foundAtRing+1) break;
  }
  return best===Infinity ? 20000 : best;
}

// Distance from a point to the nearest vertex of a specific country's own boundary — used to tell
// a wrong guesser how far off they were from the country they actually guessed.
function nearestEdgeKm(lat, lon, country){
  const pt=[lon,lat];
  let best=Infinity;
  country.polygons.forEach(poly=>{
    poly.edges.forEach(edge=>{
      const d=d3.geoDistance(pt, edge.p0)*R_KM;
      if(d<best) best=d;
    });
  });
  return best===Infinity ? 0 : best;
}

function buildCountryPool(world, countries, arcInfo){
  const decodedArcs=arcInfo.decodedArcs, arcUsage=arcInfo.arcUsage;
  function getArcPts(i){ return i>=0 ? decodedArcs[i] : decodedArcs[~i].slice().reverse(); }
  const rawGeoms=world.objects.countries.geometries;

  function buildRingEdges(ringArcIdxs){
    const edges=[];
    for(const idx of ringArcIdxs){
      const pts=getArcPts(idx);
      const key=idx>=0?idx:~idx;
      const isBorder=(arcUsage.get(key)||0)>=2;
      for(let i=0;i<pts.length-1;i++) edges.push({p0:pts[i],p1:pts[i+1],isBorder});
    }
    return edges;
  }

  const pool=[];
  for(let i=0;i<rawGeoms.length;i++){
    const g=rawGeoms[i];
    const name=g.properties && g.properties.name;
    if(!name || EXCLUDE_NAMES.has(name)) continue;
    const feature=countries.features[i];
    if(!feature || !feature.geometry) continue;
    const areaKm2=d3.geoArea(feature)*R_KM*R_KM;
    if(areaKm2<MIN_AREA_KM2) continue;

    let rawPolys, geoPolys;
    if(g.type==='Polygon'){ rawPolys=[g.arcs]; geoPolys=[feature.geometry.coordinates]; }
    else if(g.type==='MultiPolygon'){ rawPolys=g.arcs; geoPolys=feature.geometry.coordinates; }
    else continue;

    const polygons=[];
    for(let p=0;p<rawPolys.length;p++){
      const outerRingArcs=rawPolys[p][0];
      if(!outerRingArcs) continue;
      const edges=buildRingEdges(outerRingArcs);
      if(!edges.length) continue;
      const coords=geoPolys[p];
      const polyFeature={type:'Feature',geometry:{type:'Polygon',coordinates:coords},properties:{}};
      const areaP=Math.max(d3.geoArea(polyFeature)*R_KM*R_KM, 0.01);
      const centroid=d3.geoCentroid(polyFeature);
      polygons.push({edges, areaP, centroid});
    }
    if(!polygons.length) continue;
    pool.push({name, feature, areaKm2, polygons});
  }
  return pool;
}

function pickPolygon(country, rng){
  const weights=country.polygons.map(p=>Math.sqrt(p.areaP));
  const total=weights.reduce((a,b)=>a+b,0);
  let r=rng()*total;
  for(let i=0;i<country.polygons.length;i++){ r-=weights[i]; if(r<=0) return country.polygons[i]; }
  return country.polygons[country.polygons.length-1];
}
function pickEdge(edges, rng, preferBorder){
  let pool=edges;
  if(rng()<preferBorder){
    const b=edges.filter(e=>e.isBorder);
    if(b.length) pool=b;
  }else{
    const c=edges.filter(e=>!e.isBorder);
    if(c.length) pool=c;
  }
  return pool[Math.floor(rng()*pool.length)];
}

function pickPuzzlePoint(country, level, rng, coastIndex){
  const cfg=LEVELS[level-1];
  let point=null;
  for(let attempt=0; attempt<18 && !point; attempt++){
    const poly=pickPolygon(country, rng);
    const edge=pickEdge(poly.edges, rng, cfg.preferBorder);
    const tEdge=rng();
    const borderPt=d3.geoInterpolate(edge.p0, edge.p1)(tEdge);
    const shrink=Math.pow(0.6, Math.floor(attempt/3));
    const tLo=cfg.tRange[0]*shrink, tHi=cfg.tRange[1]*shrink;
    const tOff=Math.min(tLo+rng()*(tHi-tLo), 0.95);
    const cand=d3.geoInterpolate(borderPt, poly.centroid)(tOff);
    if(d3.geoContains(country.feature, cand)) point=cand;
  }
  if(!point){
    const poly=country.polygons.reduce((a,b)=>b.areaP>a.areaP?b:a);
    point=poly.centroid;
  }
  const coastKm=nearestCoastKm(point[1], point[0], coastIndex);
  return {country, level, lat:point[1], lon:point[0], coastKm};
}

// ---------- Daily puzzle plan ----------
function pickDailyCountryNames(pNum, playedNames){
  const played=new Set(playedNames||[]);
  let candidates=countryPool.filter(c=>!played.has(c.name));
  if(candidates.length<5) candidates=countryPool.slice();
  const rng=mulberry32(hashSeed(pNum, 999983));
  const arr=candidates.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr.slice(0,5).map(c=>c.name);
}
function ensureDailyState(pNum){
  let state=loadState();
  if(state.lastDay!==pNum){
    const names=pickDailyCountryNames(pNum, state.playedNames);
    state=Object.assign({}, state, {lastDay:pNum, dayCountries:names, dayIndex:0, results:[]});
    saveState(state);
  }
  return state;
}
function buildDailyPuzzles(pNum, state){
  return (state.dayCountries||[]).map((name,i)=>{
    const country=countryByName.get(name);
    const rng=mulberry32(hashSeed(pNum, i+1));
    return pickPuzzlePoint(country, i+1, rng, coastIndex);
  }).filter(Boolean);
}
function recordDailyAnswer(index, correct){
  const state=loadState();
  state.results=state.results||[];
  state.results[index]=correct;
  state.dayIndex=index+1;
  if(state.dayIndex>=5){
    const allCorrect=state.results.length===5 && state.results.every(r=>r===true);
    state.playedNames=state.playedNames||[];
    (state.dayCountries||[]).forEach(n=>{ if(!state.playedNames.includes(n)) state.playedNames.push(n); });
    if(allCorrect){ state.streak=(state.streak||0)+1; state.bestStreak=Math.max(state.bestStreak||0, state.streak); }
    else state.streak=0;
  }
  saveState(state);
  return state;
}

// ---------- Rendering ----------
// The tightest zoom that still keeps the nearest coastline comfortably inside the frame,
// at the puzzle point's own latitude (Mercator's ground-km-per-pixel varies with latitude).
function computeSafeScale(lat, coastKm){
  const k0=projection.scale();
  const halfExtentPx=Math.min(WIDTH,HEIGHT)/2*0.55; // safety margin so the coast isn't right at the edge
  const groundKmPerRadian=R_KM*Math.cos(lat*Math.PI/180);
  const safeCoastKm=Math.max(coastKm, 0.5);
  const scale=(halfExtentPx*groundKmPerRadian)/(k0*safeCoastKm);
  return Math.min(Math.max(scale,1),70);
}
function frameCurrentPoint(puzzle, animate){
  const xy=geoXY(puzzle.lat, puzzle.lon);
  const safeScale=computeSafeScale(puzzle.lat, puzzle.coastKm);
  const scale=Math.max(1, safeScale*LEVELS[puzzle.level-1].zoomFactor);
  const t=d3.zoomIdentity.translate(WIDTH/2-scale*xy[0], HEIGHT/2-scale*xy[1]).scale(scale);
  const svg=d3.select('#map');
  if(animate) svg.transition().duration(700).call(zoomBehavior.transform, t);
  else svg.call(zoomBehavior.transform, t);
}
function placePin(){
  const xy=geoXY(current.lat, current.lon);
  const g=document.getElementById('pin-mark');
  g.setAttribute('transform','translate('+xy[0]+','+xy[1]+')');
  const inner=g.querySelector('.marker-inner');
  inner.innerHTML='';
  const pin=document.createElementNS(svgNS,'path');
  pin.setAttribute('d','M0 0 C -9 -11, -9 -23, 0 -25 C 9 -23, 9 -11, 0 0 Z');
  pin.setAttribute('fill','var(--accent)');
  pin.setAttribute('stroke','var(--ink)');
  pin.setAttribute('stroke-width','0.9');
  inner.appendChild(pin);
  const hole=document.createElementNS(svgNS,'circle');
  hole.setAttribute('cx',0); hole.setAttribute('cy',-14); hole.setAttribute('r',3.2);
  hole.setAttribute('fill','var(--paper)');
  inner.appendChild(hole);
}
function clearRevealOutline(){
  ['reveal-outline','reveal-outline-guess'].forEach(id=>{
    const p=document.getElementById(id);
    p.setAttribute('d','');
    p.setAttribute('opacity','0');
  });
}
function showRevealOutline(correctFeature, guessFeature){
  const correctPath=document.getElementById('reveal-outline');
  correctPath.setAttribute('d', pathGen(correctFeature));
  correctPath.setAttribute('opacity','1');
  const guessPath=document.getElementById('reveal-outline-guess');
  if(guessFeature){
    guessPath.setAttribute('d', pathGen(guessFeature));
    guessPath.setAttribute('opacity','1');
  }else{
    guessPath.setAttribute('d','');
    guessPath.setAttribute('opacity','0');
  }
}

// ---------- Game state ----------
let mode='daily'; // 'daily' | 'freeplay'
let dailyPuzzles=[];
let current=null;
let currentIndex=0;
let answered=false;

const els={
  dateLine:document.getElementById('date-line'),
  streak:document.getElementById('streak'),
  modeLine:document.getElementById('mode-line'),
  freeplayBanner:document.getElementById('freeplay-banner'),
  pipsWrap:document.getElementById('pips-wrap'),
  pipsRow:document.getElementById('pips-row'),
  levelLabel:document.getElementById('level-label'),
  puzzleView:document.getElementById('puzzle-view'),
  mapSection:document.getElementById('map-section'),
  summaryView:document.getElementById('summary-view'),
  input:document.getElementById('guess-input'),
  submit:document.getElementById('submit-btn'),
  skip:document.getElementById('skip-btn'),
  feedback:document.getElementById('feedback'),
  stamp:document.getElementById('stamp'),
  revealName:document.getElementById('reveal-name'),
  guessLine:document.getElementById('guess-line'),
  revealNote:document.getElementById('reveal-note'),
  nextBtn:document.getElementById('next-btn'),
  summaryScore:document.getElementById('summary-score'),
  summaryPips:document.getElementById('summary-pips'),
  summarySub:document.getElementById('summary-sub'),
  countdown:document.getElementById('countdown-line'),
  share:document.getElementById('share-btn'),
  practice:document.getElementById('practice-btn'),
  suggestions:document.getElementById('suggestions'),
  mapFrame:document.getElementById('map-frame'),
  mapHint:document.getElementById('map-hint'),
  zoomIn:document.getElementById('zoom-in'),
  zoomOut:document.getElementById('zoom-out'),
  zoomReset:document.getElementById('zoom-reset')
};
let zoomLocked=true;

let countryNames=[];
let suggestionItems=[];
let activeSuggestion=-1;

function buildCountryNames(){
  countryNames=countryPool.map(c=>c.name).sort((a,b)=>a.localeCompare(b));
}

function hideSuggestions(){
  els.suggestions.classList.remove('show');
  els.suggestions.innerHTML='';
  suggestionItems=[];
  activeSuggestion=-1;
}

function renderSuggestions(query){
  const q=normalize(query);
  if(!q){ hideSuggestions(); return; }
  const starts=[], contains=[];
  countryNames.forEach(n=>{
    const nn=normalize(n);
    if(nn.startsWith(q)) starts.push(n);
    else if(nn.includes(q)) contains.push(n);
  });
  suggestionItems=starts.concat(contains).slice(0,8);
  activeSuggestion=-1;
  els.suggestions.innerHTML='';
  if(!suggestionItems.length){ els.suggestions.classList.remove('show'); return; }
  suggestionItems.forEach(name=>{
    const opt=document.createElement('div');
    opt.className='opt';
    opt.textContent=name;
    opt.addEventListener('mousedown', ev=>{
      ev.preventDefault();
      selectSuggestion(name);
    });
    els.suggestions.appendChild(opt);
  });
  els.suggestions.classList.add('show');
}

function selectSuggestion(name){
  els.input.value=name;
  hideSuggestions();
  els.input.focus();
}

function moveSuggestion(delta){
  if(!suggestionItems.length) return;
  activeSuggestion=(activeSuggestion+delta+suggestionItems.length)%suggestionItems.length;
  Array.from(els.suggestions.children).forEach((el,i)=>{
    el.classList.toggle('active', i===activeSuggestion);
  });
}

function renderPips(index, results){
  els.pipsRow.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('span');
    let cls='pip';
    if(results[i]===true) cls+=' correct filled';
    else if(results[i]===false) cls+=' wrong filled';
    else if(i===index) cls+=' current';
    d.className=cls;
    els.pipsRow.appendChild(d);
  }
}

function setRoundUI(enabled){
  els.input.disabled=!enabled;
  els.submit.disabled=!enabled;
  els.skip.disabled=!enabled;
  // Zoom/pan stay locked while a round is active (enabled) so the puzzle's
  // fixed view can't be escaped by scouting for coastline elsewhere.
  els.zoomIn.disabled=enabled;
  els.zoomOut.disabled=enabled;
  els.zoomReset.disabled=enabled;
  els.mapFrame.classList.toggle('locked', enabled);
  els.mapHint.textContent=enabled ? 'Guess to unlock pan & zoom' : 'Scroll or pinch to zoom, drag to pan';
  if(zoomBehavior) zoomLocked=enabled;
}

function loadPuzzle(puzzle, index, resultsSoFar){
  current=puzzle; currentIndex=index; answered=false;
  els.feedback.classList.remove('show');
  els.input.value='';
  hideSuggestions();
  clearRevealOutline();
  const cfg=LEVELS[puzzle.level-1];
  els.levelLabel.innerHTML='Puzzle <b>'+(index+1)+'</b> of 5 · <b>'+cfg.label+'</b>';
  renderPips(index, resultsSoFar||[]);
  setRoundUI(true);
  placePin();
  frameCurrentPoint(puzzle, false);
  els.input.focus();
}

function frameToFitBoth(guessFeature){
  const b1=pathGen.bounds(current.country.feature);
  const b2=pathGen.bounds(guessFeature);
  const minX=Math.min(b1[0][0],b2[0][0]), minY=Math.min(b1[0][1],b2[0][1]);
  const maxX=Math.max(b1[1][0],b2[1][0]), maxY=Math.max(b1[1][1],b2[1][1]);
  const spanX=Math.max(maxX-minX,1), spanY=Math.max(maxY-minY,1);
  const pad=30;
  const fitScale=Math.min(WIDTH/(spanX+pad*2), HEIGHT/(spanY+pad*2));
  const currentScale=d3.zoomTransform(document.getElementById('map')).k;
  const scale=Math.max(1, Math.min(fitScale, currentScale)); // never zoom in past where the round started
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const t=d3.zoomIdentity.translate(WIDTH/2-scale*cx, HEIGHT/2-scale*cy).scale(scale);
  d3.select('#map').transition().duration(700).call(zoomBehavior.transform, t);
}

function showAnswer(result, guessedCountry){
  answered=true;
  setRoundUI(false);
  els.feedback.classList.add('show');
  const isCorrect=(result==='correct');
  els.stamp.className='stamp '+(isCorrect?'correct':'wrong');
  els.stamp.textContent=isCorrect?'Correct':'Missed';
  els.revealName.textContent=current.country.name;
  els.guessLine.textContent=(!isCorrect && guessedCountry)
    ? 'You guessed '+guessedCountry.name+' (red) — the answer was '+current.country.name+' (green).'
    : '';
  if(!isCorrect && guessedCountry){
    const edgeKm=nearestEdgeKm(current.lat, current.lon, guessedCountry);
    els.revealNote.textContent = edgeKm<3
      ? 'This point sat almost exactly on '+guessedCountry.name+'’s border.'
      : 'This point sat roughly '+Math.round(edgeKm)+' km from '+guessedCountry.name+'’s nearest border.';
  }else{
    els.revealNote.textContent='';
  }
  const guessFeature=(!isCorrect && guessedCountry) ? guessedCountry.feature : null;
  showRevealOutline(current.country.feature, guessFeature);
  if(guessFeature) frameToFitBoth(guessFeature);

  if(mode==='daily'){
    const state=recordDailyAnswer(currentIndex, isCorrect);
    renderPips(currentIndex, state.results);
    els.streak.textContent=String(state.streak||0);
    els.nextBtn.textContent = (currentIndex<4) ? 'Next puzzle →' : 'See today’s results →';
  }else{
    els.nextBtn.textContent='Next round →';
  }
}

function submitGuess(){
  if(answered) return;
  const val=els.input.value;
  if(!val.trim()) return;
  hideSuggestions();
  const guessNorm=normalize(val);
  const guessedCountry=countryPool.find(c=>normalize(c.name)===guessNorm) || null;
  const correct=!!guessedCountry && guessedCountry.name===current.country.name;
  showAnswer(correct?'correct':'missed', guessedCountry);
}

els.submit.addEventListener('click', submitGuess);
els.input.addEventListener('input', ()=>{ renderSuggestions(els.input.value); });
els.input.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown' && els.suggestions.classList.contains('show')){
    e.preventDefault(); moveSuggestion(1);
  }else if(e.key==='ArrowUp' && els.suggestions.classList.contains('show')){
    e.preventDefault(); moveSuggestion(-1);
  }else if(e.key==='Escape'){
    hideSuggestions();
  }else if(e.key==='Enter'){
    if(activeSuggestion>=0 && suggestionItems[activeSuggestion]){
      selectSuggestion(suggestionItems[activeSuggestion]);
    }else{
      submitGuess();
    }
  }
});
els.input.addEventListener('blur', ()=>{ setTimeout(hideSuggestions, 120); });
els.skip.addEventListener('click', ()=>{ if(!answered) showAnswer('missed', null); });

els.nextBtn.addEventListener('click', ()=>{
  if(mode==='daily'){
    if(currentIndex<4){
      loadPuzzle(dailyPuzzles[currentIndex+1], currentIndex+1, loadState().results);
    }else{
      showDailySummary();
    }
  }else{
    loadFreeplayPuzzle();
  }
});

function showDailySummary(){
  const state=loadState();
  const pNum=puzzleNumber();
  const results=state.results||[];
  els.puzzleView.style.display='none';
  els.pipsWrap.style.display='none';
  els.mapSection.style.display='none';
  els.summaryView.classList.add('show');
  const correctCount=results.filter(r=>r===true).length;
  els.summaryScore.textContent=correctCount+' / 5';
  els.summaryPips.innerHTML='';
  results.forEach(r=>{
    const s=document.createElement('span');
    s.className=r?'correct':'wrong';
    s.textContent=r?'✓':'✗';
    els.summaryPips.appendChild(s);
  });
  els.summarySub.textContent='Puzzle #'+pNum+' · '+formatDate()+(state.streak?(' · perfect streak '+state.streak):'');
  startCountdown();
}

function startCountdown(){
  const tick=()=>{
    const ms=msUntilNextUTCMidnight();
    els.countdown.innerHTML='Next set in <b>'+formatCountdown(ms)+'</b>';
    if(ms<=0){ location.reload(); }
  };
  tick();
  setInterval(tick, 1000);
}

els.share.addEventListener('click', async()=>{
  const state=loadState();
  const pNum=puzzleNumber();
  const results=state.results||[];
  const pips=results.map(r=>r?'🟩':'🟥').join('');
  const text='guess da country #'+pNum+'  '+pips+(state.streak?(' · streak '+state.streak):'');
  try{
    if(navigator.share){ await navigator.share({text}); }
    else{
      await navigator.clipboard.writeText(text);
      els.share.textContent='Copied!';
      setTimeout(()=>{ els.share.textContent='Share result'; }, 1500);
    }
  }catch(e){}
});

function loadFreeplayPuzzle(){
  const country=countryPool[Math.floor(Math.random()*countryPool.length)];
  const level=1+Math.floor(Math.random()*5);
  const rng=mulberry32((Math.random()*4294967296)>>>0);
  const puzzle=pickPuzzlePoint(country, level, rng, coastIndex);
  loadPuzzle(puzzle, 0, []);
  els.pipsWrap.style.display='none';
}

els.practice.addEventListener('click', ()=>{
  mode='freeplay';
  els.modeLine.textContent='Practice';
  els.freeplayBanner.classList.add('show');
  els.summaryView.classList.remove('show');
  els.puzzleView.style.display='';
  els.mapSection.style.display='';
  loadFreeplayPuzzle();
});

function startDailyRound(){
  const pNum=puzzleNumber();
  const state=ensureDailyState(pNum);
  dailyPuzzles=buildDailyPuzzles(pNum, state);
  els.dateLine.textContent='Puzzle #'+pNum+' · '+formatDate();
  els.streak.textContent=String(state.streak||0);

  if((state.dayIndex||0)>=5){
    showDailySummary();
    return;
  }
  els.puzzleView.style.display='';
  els.pipsWrap.style.display='';
  loadPuzzle(dailyPuzzles[state.dayIndex||0], state.dayIndex||0, state.results||[]);
}

async function init(){
  try{
    const [world, worldLand]=await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-10m.json').then(r=>r.json()),
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-10m.json').then(r=>r.json())
    ]);
    const countries=topojson.feature(world, world.objects.countries);
    const land=topojson.feature(worldLand, worldLand.objects.land);

    projection=d3.geoMercator().fitSize([WIDTH,HEIGHT], countries);
    pathGen=d3.geoPath().projection(projection);
    document.getElementById('land').setAttribute('d', pathGen(land));
    document.getElementById('loading-text').remove();

    // The antimeridian (e.g. through Fiji) gets clipped to a straight synthetic edge by the
    // projection. Rather than exclude puzzles near it, tile a west/east copy of the whole map
    // so panning/zooming near that seam shows a seamless continuation instead of a hard cutoff.
    const worldPixelWidth=2*Math.PI*projection.scale();
    ['land','reveal-outline','reveal-outline-guess'].forEach(id=>{
      ['world-west','world-east'].forEach(groupId=>{
        const use=document.createElementNS(svgNS,'use');
        use.setAttribute('href','#'+id);
        use.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+id);
        const dx=groupId==='world-west' ? -worldPixelWidth : worldPixelWidth;
        use.setAttribute('transform','translate('+dx+',0)');
        document.getElementById(groupId).appendChild(use);
      });
    });

    const arcInfo=computeArcInfo(world);
    coastIndex=buildCoastIndex(arcInfo);
    countryPool=buildCountryPool(world, countries, arcInfo);
    countryByName=new Map(countryPool.map(c=>[c.name,c]));
    buildCountryNames();

    const svg=d3.select('#map');
    const zoomLayer=d3.select('#zoom-layer');
    zoomBehavior=d3.zoom()
      .scaleExtent([1,300])
      .filter((event)=> !zoomLocked && (!event.ctrlKey || event.type==='wheel') && !event.button)
      .on('zoom',(event)=>{
        zoomLayer.attr('transform', event.transform);
        const k=event.transform.k;
        document.querySelector('#pin-mark .marker-inner').setAttribute('transform','scale('+(1/k)+')');
        document.querySelector('#pin-mark .pulse').setAttribute('transform','scale('+(1/k)+')');
      });
    svg.call(zoomBehavior);

    els.zoomIn.addEventListener('click',()=>{ if(!zoomLocked) svg.transition().duration(300).call(zoomBehavior.scaleBy,1.6); });
    els.zoomOut.addEventListener('click',()=>{ if(!zoomLocked) svg.transition().duration(300).call(zoomBehavior.scaleBy,0.625); });
    els.zoomReset.addEventListener('click',()=>{ if(!zoomLocked && current) frameCurrentPoint(current, true); });

    startDailyRound();
  }catch(err){
    document.getElementById('loading-text').textContent='Could not load map data — check your internet connection and reload.';
    console.error(err);
  }
}
init();
</script>
