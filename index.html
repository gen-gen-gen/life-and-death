<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas of lives — guess the celebrity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1E6CB;
    --paper-deep:#E6D6AC;
    --ink:#2B2A28;
    --ink-soft:#74695A;
    --green:#3F6B4A;
    --red:#9C3B33;
    --line:#C9B98B;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper-deep);
    background-image:
      radial-gradient(circle at 18% 16%, rgba(255,255,255,0.3), transparent 60%),
      radial-gradient(circle at 82% 84%, rgba(0,0,0,0.07), transparent 60%);
    font-family:'Lora', serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .sheet{
    width:100%;
    max-width:760px;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 0 0 1px var(--paper-deep), 0 12px 30px rgba(43,42,40,0.18);
    padding:32px 32px 36px;
    position:relative;
  }
  .sheet::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  header{ text-align:center; margin-bottom:8px; }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:32px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  .tagline{
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 18px;
  }
  .stat-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-family:'Special Elite', monospace;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);
    padding:8px 2px;
    margin-bottom:18px;
    letter-spacing:0.5px;
    flex-wrap:wrap;
  }
  .stat-row b{ color:var(--ink); font-weight:400; }
  .map-frame{
    border:1px solid var(--ink-soft);
    box-shadow:0 0 0 4px var(--paper), 0 0 0 5px var(--ink-soft);
    margin-bottom:10px;
    background:var(--paper-deep);
    overflow:hidden;
    position:relative;
  }
  svg.map{ display:block; width:100%; height:auto; cursor:grab; touch-action:none; }
  svg.map:active{ cursor:grabbing; }
  .map-hint{
    text-align:center;
    font-size:11px;
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .zoom-controls{
    display:flex; gap:8px; justify-content:center;
    margin:0 0 18px;
  }
  .zoom-controls button{ padding:4px 16px; }
  .legend{
    display:flex; gap:20px; justify-content:center;
    font-family:'Special Elite', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:-6px 0 18px;
    letter-spacing:0.5px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .hints{
    border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);
    padding:14px 4px;
    margin:0 0 18px;
  }
  .hints-label{
    font-family:'Special Elite', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 10px;
    text-align:center;
  }
  .hint-buttons{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .hint-btn{
    padding:10px 6px;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    line-height:1.3;
    min-height:60px;
    justify-content:center;
  }
  .hint-btn .hint-title{ font-size:11px; letter-spacing:0.5px; }
  .hint-btn .hint-value{
    font-family:'Lora', serif;
    font-style:italic;
    font-size:13px;
    color:var(--ink);
    text-transform:none;
    letter-spacing:0;
  }
  .hint-btn.revealed{
    cursor:default;
    background:var(--paper-deep);
    border-color:var(--ink-soft);
  }
  .hint-btn.revealed:hover{ background:var(--paper-deep); color:var(--ink); }

  .guess-row{ display:flex; gap:10px; margin-bottom:8px; }
  input[type=text]{
    flex:1;
    font-family:'Lora', serif;
    font-size:16px;
    padding:10px 4px;
    border:none;
    border-bottom:1px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  input[type=text]:focus{ border-bottom-color:var(--ink); }
  input[type=text]:disabled{ opacity:0.5; }
  button{
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    padding:0 18px;
    cursor:pointer;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    white-space:nowrap;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  button:hover:not(:disabled){ background:var(--ink); color:var(--paper); }
  button:active:not(:disabled){ transform:scale(0.97); }
  button:disabled{ opacity:0.35; cursor:default; }
  .skip-link{
    display:block;
    width:100%;
    text-align:center;
    border:none;
    background:none;
    text-decoration:underline;
    font-family:'Lora', serif;
    font-size:12px;
    color:var(--ink-soft);
    padding:4px 0 0;
  }
  .skip-link:hover:not(:disabled){ background:none; color:var(--ink); }
  .feedback{
    margin-top:22px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    display:none;
    position:relative;
  }
  .feedback.show{ display:block; }
  .stamp{
    position:absolute;
    top:6px; right:6px;
    width:80px; height:80px;
    border-radius:50%;
    border:3px double currentColor;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:'Special Elite', monospace;
    font-size:13px;
    text-transform:uppercase;
    transform:rotate(-10deg);
    line-height:1.2;
  }
  .stamp.correct{ color:var(--green); }
  .stamp.wrong{ color:var(--red); }
  .reveal-name{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 6px;
    padding-right:96px;
  }
  .reveal-bio{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 10px;
    padding-right:96px;
    line-height:1.6;
  }
  .countdown{
    font-family:'Special Elite', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin:14px 0 0;
    padding-right:96px;
  }
  .countdown b{ color:var(--ink); font-weight:400; }
  .feedback-actions{
    display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;
  }
  .loading-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:40px 0;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
  @media (max-width:480px){
    .sheet{ padding:22px 18px 28px; }
    h1{ font-size:26px; }
    .stamp{ width:60px; height:60px; font-size:10px; top:0; right:0; }
    .reveal-name, .reveal-bio, .countdown{ padding-right:0; }
    .hint-buttons{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <h1>Atlas of lives</h1>
    <p class="tagline" id="tagline">Today's traveller — name them from where they began and ended.</p>
  </header>
  <div class="stat-row">
    <span id="date-line">Loading…</span>
    <span>Streak <b id="streak">0</b></span>
    <span>Hints <b id="hints-used">0</b>/3</span>
  </div>
  <div class="map-frame">
    <svg id="map" class="map" viewBox="0 0 680 420" role="img" aria-label="Zoomable world map with a birth point in green and a death point in red">
      <rect x="0" y="0" width="680" height="420" fill="var(--paper-deep)"></rect>
      <g id="zoom-layer">
        <path id="land" fill="var(--paper)" stroke="var(--ink-soft)" stroke-width="0.6" vector-effect="non-scaling-stroke"></path>
        <line id="connector" x1="0" y1="0" x2="0" y2="0" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.65" vector-effect="non-scaling-stroke"></line>
        <g id="birth-mark"><g class="marker-inner"></g></g>
        <g id="death-mark"><g class="marker-inner"></g></g>
      </g>
      <text id="loading-text" x="340" y="210" text-anchor="middle" font-family="'Special Elite', monospace" font-size="13" fill="var(--ink-soft)">Unrolling the map…</text>
    </svg>
  </div>
  <p class="map-hint">Scroll or pinch to zoom, drag to pan</p>
  <div class="zoom-controls">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-reset" type="button" aria-label="Reset view to both points">Reset view</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--green)"></span>Birth</span>
    <span><span class="dot" style="background:var(--red)"></span>Death</span>
  </div>

  <div class="hints" id="hints-block">
    <p class="hints-label">Need a clue?</p>
    <div class="hint-buttons">
      <button class="hint-btn" type="button" data-hint="occupation"><span class="hint-title">Occupation</span></button>
      <button class="hint-btn" type="button" data-hint="initials"><span class="hint-title">Initials</span></button>
      <button class="hint-btn" type="button" data-hint="death"><span class="hint-title">Manner of death</span></button>
    </div>
  </div>

  <div class="guess-row">
    <input type="text" id="guess-input" placeholder="Who is it? Type a name…" autocomplete="off" disabled>
    <button id="submit-btn" type="button" disabled>Submit</button>
  </div>
  <button class="skip-link" id="skip-btn" type="button" disabled>I don't know — reveal</button>

  <div class="feedback" id="feedback">
    <div class="stamp" id="stamp"></div>
    <p class="reveal-name" id="reveal-name"></p>
    <p class="reveal-bio" id="reveal-bio"></p>
    <p class="countdown" id="countdown-line"></p>
    <div class="feedback-actions">
      <button id="share-btn" type="button">Share result</button>
      <button id="freeplay-btn" type="button">Keep playing →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const svgNS='http://www.w3.org/2000/svg';
const WIDTH=680, HEIGHT=420;
const STORAGE_KEY='atlas-of-lives:v1';
const EPOCH_UTC=Date.UTC(2026,0,1); // Day 1 = Jan 1 2026 UTC

const celebs=[
{name:"Albert Einstein",aliases:["einstein","albert einstein"],by:1879,bp:[48.4,9.99,"Ulm, Germany"],dy:1955,dp:[40.35,-74.66,"Princeton, USA"],occupation:"Theoretical physicist",death:"Natural causes — aortic aneurysm"},
{name:"Marilyn Monroe",aliases:["marilyn monroe","marilyn","monroe"],by:1926,bp:[34.05,-118.24,"Los Angeles, USA"],dy:1962,dp:[34.05,-118.24,"Los Angeles, USA"],occupation:"Actress and model",death:"Barbiturate overdose"},
{name:"Mahatma Gandhi",aliases:["gandhi","mahatma gandhi","mohandas gandhi"],by:1869,bp:[21.64,69.6,"Porbandar, India"],dy:1948,dp:[28.6,77.2,"New Delhi, India"],occupation:"Independence activist and lawyer",death:"Assassination — shot"},
{name:"Wolfgang Amadeus Mozart",aliases:["mozart","wolfgang amadeus mozart","wolfgang mozart"],by:1756,bp:[47.8,13.05,"Salzburg, Austria"],dy:1791,dp:[48.2,16.37,"Vienna, Austria"],occupation:"Composer",death:"Acute illness (cause disputed)"},
{name:"Frida Kahlo",aliases:["frida kahlo","frida","kahlo"],by:1907,bp:[19.35,-99.16,"Coyoacán, Mexico"],dy:1954,dp:[19.35,-99.16,"Coyoacán, Mexico"],occupation:"Painter",death:"Pulmonary embolism"},
{name:"Napoleon Bonaparte",aliases:["napoleon","napoleon bonaparte","bonaparte"],by:1769,bp:[41.92,8.74,"Ajaccio, Corsica"],dy:1821,dp:[-15.96,-5.7,"Saint Helena"],occupation:"Military leader and emperor",death:"Stomach cancer, in exile"},
{name:"Vincent van Gogh",aliases:["van gogh","vincent van gogh","vincent"],by:1853,bp:[51.47,4.65,"Zundert, Netherlands"],dy:1890,dp:[49.07,2.17,"Auvers-sur-Oise, France"],occupation:"Painter",death:"Self-inflicted gunshot wound"},
{name:"Abraham Lincoln",aliases:["lincoln","abraham lincoln","abe lincoln"],by:1809,bp:[37.56,-85.74,"Hodgenville, USA"],dy:1865,dp:[38.9,-77.04,"Washington DC, USA"],occupation:"Statesman and president",death:"Assassination — shot"},
{name:"Marie Curie",aliases:["marie curie","curie"],by:1867,bp:[52.23,21.01,"Warsaw, Poland"],dy:1934,dp:[45.9,6.6,"Passy, France"],occupation:"Physicist and chemist",death:"Aplastic anemia, from radiation exposure"},
{name:"Michael Jackson",aliases:["michael jackson","mj"],by:1958,bp:[41.6,-87.34,"Gary, USA"],dy:2009,dp:[34.05,-118.24,"Los Angeles, USA"],occupation:"Singer and dancer",death:"Acute propofol intoxication"},
{name:"Elvis Presley",aliases:["elvis","elvis presley","presley"],by:1935,bp:[34.26,-88.7,"Tupelo, USA"],dy:1977,dp:[35.15,-90.05,"Memphis, USA"],occupation:"Singer and actor",death:"Heart attack"},
{name:"John Lennon",aliases:["john lennon","lennon"],by:1940,bp:[53.41,-2.98,"Liverpool, UK"],dy:1980,dp:[40.71,-74.01,"New York City, USA"],occupation:"Musician and songwriter",death:"Assassination — shot"},
{name:"Pablo Picasso",aliases:["picasso","pablo picasso"],by:1881,bp:[36.72,-4.42,"Málaga, Spain"],dy:1973,dp:[43.6,7.0,"Mougins, France"],occupation:"Painter and sculptor",death:"Pulmonary edema and heart failure"},
{name:"Bruce Lee",aliases:["bruce lee"],by:1940,bp:[37.77,-122.42,"San Francisco, USA"],dy:1973,dp:[22.32,114.17,"Hong Kong"],occupation:"Martial artist and actor",death:"Cerebral edema (allergic reaction)"},
{name:"Anne Frank",aliases:["anne frank"],by:1929,bp:[50.11,8.68,"Frankfurt, Germany"],dy:1945,dp:[52.76,9.91,"Bergen-Belsen, Germany"],occupation:"Diarist",death:"Typhus in a concentration camp"},
{name:"Princess Diana",aliases:["princess diana","diana","lady diana"],by:1961,bp:[52.83,0.51,"Sandringham, UK"],dy:1997,dp:[48.86,2.35,"Paris, France"],occupation:"Royal and philanthropist",death:"Injuries from a car crash"},
{name:"Steve Jobs",aliases:["steve jobs","jobs"],by:1955,bp:[37.77,-122.42,"San Francisco, USA"],dy:2011,dp:[37.44,-122.14,"Palo Alto, USA"],occupation:"Tech entrepreneur",death:"Pancreatic cancer"},
{name:"Freddie Mercury",aliases:["freddie mercury","freddie","mercury"],by:1946,bp:[-6.16,39.2,"Zanzibar, Tanzania"],dy:1991,dp:[51.51,-0.13,"London, UK"],occupation:"Singer and songwriter",death:"AIDS-related pneumonia"},
{name:"Leonardo da Vinci",aliases:["leonardo da vinci","leonardo","da vinci","davinci"],by:1452,bp:[43.78,10.92,"Vinci, Italy"],dy:1519,dp:[47.41,0.98,"Amboise, France"],occupation:"Polymath — painter, inventor, scientist",death:"Natural causes (likely stroke)"},
{name:"Charlie Chaplin",aliases:["charlie chaplin","chaplin"],by:1889,bp:[51.51,-0.13,"London, UK"],dy:1977,dp:[46.46,6.84,"Vevey, Switzerland"],occupation:"Film actor and director",death:"Stroke in his sleep"}
];

function initialsOf(name){
  const parts=name.trim().split(/\s+/);
  return parts[0][0].toUpperCase()+'.'+parts[parts.length-1][0].toUpperCase()+'.';
}

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const dp=[];
  for(let i=0;i<=a.length;i++){ dp.push([i]); }
  for(let j=0;j<=b.length;j++){ dp[0][j]=j; }
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j]=a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}
function checkGuess(raw,c){
  const g=normalize(raw);
  if(!g) return false;
  for(const a of c.aliases){
    const na=normalize(a);
    if(na===g) return true;
    if(na.length>=5 && lev(g,na)<=1) return true;
  }
  return false;
}

// ---------- Daily logic ----------
function todayUTC(){
  const n=new Date();
  return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate());
}
function puzzleNumber(){
  return Math.floor((todayUTC()-EPOCH_UTC)/86400000)+1;
}
function todaysCeleb(){
  const idx=((puzzleNumber()-1) % celebs.length + celebs.length) % celebs.length;
  return celebs[idx];
}
function msUntilNextUTCMidnight(){
  const n=new Date();
  const next=Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()+1, 0, 0, 0);
  return next - n.getTime();
}
function formatCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function formatDate(){
  const n=new Date();
  return n.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'})+' (UTC)';
}

// ---------- Persistent state ----------
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}

// ---------- Map / projection ----------
let projection, zoomBehavior;
function geoXY(lat,lon){ return projection([lon,lat]); }

function placeMarker(groupId,lat,lon,year,color){
  const g=document.getElementById(groupId);
  const xy=geoXY(lat,lon);
  g.setAttribute('transform','translate('+xy[0]+','+xy[1]+')');
  const inner=g.querySelector('.marker-inner');
  inner.innerHTML='';
  inner.removeAttribute('transform');
  const pin=document.createElementNS(svgNS,'path');
  pin.setAttribute('d','M0 0 C -9 -11, -9 -23, 0 -25 C 9 -23, 9 -11, 0 0 Z');
  pin.setAttribute('fill',color);
  pin.setAttribute('stroke','var(--ink)');
  pin.setAttribute('stroke-width','0.9');
  inner.appendChild(pin);
  const hole=document.createElementNS(svgNS,'circle');
  hole.setAttribute('cx',0); hole.setAttribute('cy',-14); hole.setAttribute('r',3.2);
  hole.setAttribute('fill','var(--paper)');
  inner.appendChild(hole);
  const label=document.createElementNS(svgNS,'text');
  label.setAttribute('x',0); label.setAttribute('y',-30);
  label.setAttribute('text-anchor','middle');
  label.setAttribute('font-family',"'Special Elite', monospace");
  label.setAttribute('font-size','12');
  label.setAttribute('fill',color);
  label.textContent=year;
  inner.appendChild(label);
  return xy;
}

function frameCurrentRound(animate){
  const b=geoXY(current.bp[0],current.bp[1]);
  const d=geoXY(current.dp[0],current.dp[1]);
  const minX=Math.min(b[0],d[0]), maxX=Math.max(b[0],d[0]);
  const minY=Math.min(b[1],d[1]), maxY=Math.max(b[1],d[1]);
  const spanX=Math.max(maxX-minX,1), spanY=Math.max(maxY-minY,1);
  const pad=100;
  let scale=Math.min(WIDTH/(spanX+pad*2), HEIGHT/(spanY+pad*2));
  scale=Math.max(1, Math.min(scale, 22));
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const t=d3.zoomIdentity.translate(WIDTH/2-scale*cx, HEIGHT/2-scale*cy).scale(scale);
  const svg=d3.select('#map');
  if(animate) svg.transition().duration(800).call(zoomBehavior.transform, t);
  else svg.call(zoomBehavior.transform, t);
}

// ---------- Game state ----------
let mode='daily';        // 'daily' or 'freeplay'
let current=null;
let answered=false;
let hintsUsed=0;
let countdownTimer=null;
let freeplayOrder=[];
let freeplayPointer=0;

const els={
  tagline:document.getElementById('tagline'),
  dateLine:document.getElementById('date-line'),
  streak:document.getElementById('streak'),
  hintsUsedEl:document.getElementById('hints-used'),
  input:document.getElementById('guess-input'),
  submit:document.getElementById('submit-btn'),
  skip:document.getElementById('skip-btn'),
  feedback:document.getElementById('feedback'),
  stamp:document.getElementById('stamp'),
  revealName:document.getElementById('reveal-name'),
  revealBio:document.getElementById('reveal-bio'),
  countdown:document.getElementById('countdown-line'),
  share:document.getElementById('share-btn'),
  freeplay:document.getElementById('freeplay-btn'),
  hintsBlock:document.getElementById('hints-block')
};

function resetHintButtons(){
  document.querySelectorAll('.hint-btn').forEach(btn=>{
    btn.classList.remove('revealed');
    btn.disabled=false;
    const valueEl=btn.querySelector('.hint-value');
    if(valueEl) valueEl.remove();
  });
  hintsUsed=0;
  els.hintsUsedEl.textContent='0';
}

function revealHint(btn){
  if(btn.classList.contains('revealed') || answered) return;
  const kind=btn.dataset.hint;
  let value='';
  if(kind==='occupation') value=current.occupation;
  else if(kind==='initials') value=initialsOf(current.name);
  else if(kind==='death') value=current.death;
  const span=document.createElement('span');
  span.className='hint-value';
  span.textContent=value;
  btn.appendChild(span);
  btn.classList.add('revealed');
  hintsUsed++;
  els.hintsUsedEl.textContent=String(hintsUsed);
}
document.querySelectorAll('.hint-btn').forEach(btn=>{
  btn.addEventListener('click',()=>revealHint(btn));
});

function setRoundUI(enabled){
  els.input.disabled=!enabled;
  els.submit.disabled=!enabled;
  els.skip.disabled=!enabled;
  document.querySelectorAll('.hint-btn').forEach(b=>{
    if(!b.classList.contains('revealed')) b.disabled=!enabled;
  });
}

function startDailyRound(){
  const state=loadState();
  const pNum=puzzleNumber();
  current=todaysCeleb();
  els.dateLine.textContent='Puzzle #'+pNum+' · '+formatDate();
  els.tagline.textContent="Today's traveller — name them from where they began and ended.";
  els.streak.textContent=String(state.streak||0);
  els.feedback.classList.remove('show');
  els.input.value='';
  resetHintButtons();
  answered=false;

  if(state.lastDay===pNum){
    // Already played today — restore final state
    placePinsAndFrame();
    showResult(state.lastResult, state.lastHintsUsed||0, /*persist*/false);
    return;
  }
  setRoundUI(true);
  placePinsAndFrame();
  els.input.focus();
}

function startFreeplayRound(){
  if(!freeplayOrder.length || freeplayPointer>=freeplayOrder.length){
    freeplayOrder=celebs.map((_,i)=>i).filter(i=>celebs[i]!==todaysCeleb());
    for(let i=freeplayOrder.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [freeplayOrder[i],freeplayOrder[j]]=[freeplayOrder[j],freeplayOrder[i]];
    }
    freeplayPointer=0;
  }
  current=celebs[freeplayOrder[freeplayPointer++]];
  els.tagline.textContent='Free play — random figure.';
  els.dateLine.textContent='Free play round';
  els.feedback.classList.remove('show');
  els.input.value='';
  resetHintButtons();
  answered=false;
  setRoundUI(true);
  placePinsAndFrame();
  els.input.focus();
}

function placePinsAndFrame(){
  const b=placeMarker('birth-mark', current.bp[0], current.bp[1], current.by, 'var(--green)');
  const d=placeMarker('death-mark', current.dp[0], current.dp[1], current.dy, 'var(--red)');
  const connector=document.getElementById('connector');
  connector.setAttribute('x1',b[0]); connector.setAttribute('y1',b[1]);
  connector.setAttribute('x2',d[0]); connector.setAttribute('y2',d[1]);
  frameCurrentRound(true);
}

function showResult(result, hintsAtSubmit, persist){
  answered=true;
  setRoundUI(false);
  els.feedback.classList.add('show');
  const isCorrect=(result==='correct');
  els.stamp.className='stamp '+(isCorrect?'correct':'wrong');
  els.stamp.textContent=isCorrect?'Correct':'Missed';
  els.revealName.textContent=current.name;
  els.revealBio.textContent='Born '+current.by+' in '+current.bp[2]+'. Died '+current.dy+' in '+current.dp[2]+'.';

  if(mode==='daily'){
    if(persist){
      const state=loadState();
      state.lastDay=puzzleNumber();
      state.lastResult=result;
      state.lastHintsUsed=hintsAtSubmit;
      if(isCorrect){
        state.streak=(state.streak||0)+1;
        state.bestStreak=Math.max(state.bestStreak||0, state.streak);
      }else{
        state.streak=0;
      }
      saveState(state);
      els.streak.textContent=String(state.streak||0);
    }
    els.share.style.display='';
    els.freeplay.textContent='Keep playing (free play) →';
    startCountdown();
  }else{
    els.share.style.display='none';
    els.freeplay.textContent='Next figure →';
    els.countdown.textContent='';
  }
}

function startCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  const tick=()=>{
    const ms=msUntilNextUTCMidnight();
    els.countdown.innerHTML='Next puzzle in <b>'+formatCountdown(ms)+'</b>';
    if(ms<=0){
      clearInterval(countdownTimer);
      countdownTimer=null;
      // Auto-roll into the new day
      if(mode==='daily') startDailyRound();
    }
  };
  tick();
  countdownTimer=setInterval(tick,1000);
}

function submitGuess(){
  if(answered) return;
  const val=els.input.value;
  if(!val.trim()) return;
  const isCorrect=checkGuess(val,current);
  showResult(isCorrect?'correct':'missed', hintsUsed, /*persist*/ mode==='daily');
}

els.submit.addEventListener('click',submitGuess);
els.input.addEventListener('keydown',e=>{ if(e.key==='Enter') submitGuess(); });
els.skip.addEventListener('click',()=>showResult('missed', hintsUsed, mode==='daily'));

els.freeplay.addEventListener('click',()=>{
  mode='freeplay';
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
  startFreeplayRound();
});

els.share.addEventListener('click',async()=>{
  const state=loadState();
  const pNum=puzzleNumber();
  const ok=state.lastResult==='correct';
  const hu=state.lastHintsUsed||0;
  const hintGlyphs='💡'.repeat(hu)+'·'.repeat(3-hu);
  const text='Atlas of Lives #'+pNum+' '+(ok?'✓':'✗')+' '+hintGlyphs+(state.streak?(' · streak '+state.streak):'');
  try{
    if(navigator.share){
      await navigator.share({text});
    }else{
      await navigator.clipboard.writeText(text);
      els.share.textContent='Copied!';
      setTimeout(()=>{ els.share.textContent='Share result'; }, 1500);
    }
  }catch(e){}
});

async function init(){
  try{
    const world=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r=>r.json());
    const countries=topojson.feature(world, world.objects.countries);
    projection=d3.geoMercator().fitSize([WIDTH,HEIGHT], countries);
    const pathGen=d3.geoPath().projection(projection);
    document.getElementById('land').setAttribute('d', pathGen(countries));
    document.getElementById('loading-text').remove();

    const svg=d3.select('#map');
    const zoomLayer=d3.select('#zoom-layer');
    zoomBehavior=d3.zoom()
      .scaleExtent([1,24])
      .on('zoom',(event)=>{
        zoomLayer.attr('transform', event.transform);
        const k=event.transform.k;
        document.querySelector('#birth-mark .marker-inner').setAttribute('transform','scale('+(1/k)+')');
        document.querySelector('#death-mark .marker-inner').setAttribute('transform','scale('+(1/k)+')');
      });
    svg.call(zoomBehavior);

    document.getElementById('zoom-in').addEventListener('click',()=>svg.transition().duration(300).call(zoomBehavior.scaleBy,1.6));
    document.getElementById('zoom-out').addEventListener('click',()=>svg.transition().duration(300).call(zoomBehavior.scaleBy,0.625));
    document.getElementById('zoom-reset').addEventListener('click',()=>frameCurrentRound(true));

    startDailyRound();
  }catch(err){
    document.getElementById('loading-text').textContent='Could not load map data — check your internet connection and reload.';
    console.error(err);
  }
}
init();
</script>
</body>
</html>
